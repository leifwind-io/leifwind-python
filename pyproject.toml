[project]
name = "leifwind-stream-client"
dynamic = ["version"]
description = "Python client for the Leifwind Stream metadata-driven REST API"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
root = "."
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/leifwind"]

[tool.hatch.build.targets.sdist]
exclude = [".uv-cache"]
