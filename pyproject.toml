[project]
name = "leifwind-stream-client"
dynamic = ["version"]
description = "Python client for the Leifwind Stream metadata-driven REST API"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

# The package's own tags (spec §5): client/vX.Y.Z, from the Phase 6 baseline
# client/v0.9.0 on. Never the backend's plain v* tags.
[tool.hatch.version.raw-options]
root = "."
dist_name = "leifwind-stream-client"
local_scheme = "no-local-version"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/leifwind"]

[tool.hatch.build.targets.sdist]
exclude = [".uv-cache"]

[tool.pytest]
# Unit tests against httpx's MockTransport, no backend: the backend's suite
# drives the client against a real one. The coverage floor is a CI gate
# (ci/gate-inventory.md): the coverage measured when the tests moved here
# (62.26 %), rounded down (spec §5). Lint is repo:lint's job.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--cov", "leifwind.stream.client", "--cov-fail-under=62"]
