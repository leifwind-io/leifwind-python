[project]
name = "leifwind-stream-client"
dynamic = ["version"]
description = "Python client for the Leifwind Stream metadata-driven REST API"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12",
    "httpx>=0.28.1",
]

# The public, read-only mirror of this package (spec §7): its source, its
# releases (wheel and sdist on each GitHub Release) and its issues.
[project.urls]
Source = "https://github.com/leifwind-io/leifwind-python"
Issues = "https://github.com/leifwind-io/leifwind-python/issues"
Releases = "https://github.com/leifwind-io/leifwind-python/releases"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

# The package's own tags (spec §5): client/vX.Y.Z, from the Phase 6 baseline
# client/v0.9.0 on. Never the backend's plain v* tags.
[tool.hatch.version.raw-options]
root = "."
dist_name = "leifwind-stream-client"
local_scheme = "no-local-version"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/leifwind"]

[tool.hatch.build.targets.sdist]
exclude = [".uv-cache"]

[tool.pytest]
# Unit tests against httpx's MockTransport, no backend: the backend's suite
# drives the client against a real one. The coverage floor is a CI gate
# (ci/gate-inventory.md): the coverage measured when the tests moved here
# (62.26 %), rounded down (spec §5). Lint is repo:lint's job.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--cov", "leifwind.stream.client", "--cov-fail-under=62"]

# This package's releases (spec §5 "Versioning"): `client/vX.Y.Z`, computed by
# PSR from the conventional commits that touch path_filters, run from this
# directory. Compute-only: CI creates the tag and its Release server-side
# (ci/release_tag.sh); PSR never pushes, commits or writes files.
[tool.semantic_release]
tag_format = "client/v{version}"
commit_parser = "conventional-monorepo"
major_on_zero = false
# PSR 10 defaults allow_zero_version to false, which would mint 1.0.0 on the
# first run (verified with PSR 10.6.1, spec key decision 7).
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
# Relative to this directory: the package alone: the wheel ships no lock.
path_filters = [
  ".",
]

[tool.semantic_release.remote]
# Compute-only never calls the API, but PSR parses the origin URL regardless.
type = "gitlab"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# hotfix/* and rc/* mint X.Y.Z-rc.N; only main moves `latest`.
[tool.semantic_release.branches.prerelease]
match = "^(hotfix|rc)/"
prerelease = true
prerelease_token = "rc"
